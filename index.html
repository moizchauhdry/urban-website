<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/urban-favicon.png" sizes="32x32" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta

      name="description"

      content="Enjoy comfortable Connecticut car service with professional drivers and smooth airport transfers to JFK LGA and NYC. Safe rides for business and leisure travelers."

    />

    <title>Urban Elite Limo</title>

    <!-- Critical shell: avoids blank flash before app CSS loads -->

    <style>
      body{margin:0;background:#fff;font-family:'Space Grotesk',system-ui,sans-serif;position:relative}
      #root{min-height:100vh;position:relative;z-index:1}
    </style>

  </head>

  <body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6657T6P"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Defer GTM until after load so it does not compete with LCP -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function loadGtm() {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var j = document.createElement('script');
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-N6657T6P';
        document.head.appendChild(j);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGtm, { timeout: 4000 });
      } else {
        window.addEventListener('load', function () {
          setTimeout(loadGtm, 1500);
        });
      }
    </script>

  </body>

</html>
